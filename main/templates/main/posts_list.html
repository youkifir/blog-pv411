{% extends "main/base.html" %}

{% block title %} {{ title }} {% endblock title %}

{% block main %}
    <h2>Posts</h2>
    <div>
        {% for post in posts %}
            <div>
                <h3>{{ post.title }}</h3>
                <p>{{ post.content }}</p>
            </div>
        {% endfor %}
    </div>
{% endblock main %}
